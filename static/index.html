<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tan-kung | Tangerine Workspace Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
</head>
<body>

    <header class="top-nav">
        <img class="main-logo" src="/static/tangerine-logo.png" alt="Tangerine Logo">
        <div class="header-tagline">Tangerine Support</div>
    </header>

    <div class="main-content">
        <main class="chat-column">
            <div class="chat-container" style="position: relative;"> 
                <div class="header">
                    <img class="avatar" src="static/bot_avater.png" alt="Tan-kung">
                    <h2>Tan-kung Support</h2>
                </div>

                <div id="chatLockOverlay">
                <p>Please enter your name in the sidebar to start.</p>
                </div>

                <div id="chatbox"></div>

                <div class="input-area">
                <input type="text" id="userInput" placeholder="Locked..." disabled onkeypress="if(event.key==='Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
                </div>
            </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-widget">
                <label>User Name</label>
                <input type="text" id="userNameInput" placeholder="Enter your name">
                <button id="saveNameBtn" onclick="unlockChat()" style="padding: 5px 10px; border-radius: 8px;">Save</button>       
            </div>

            <div class="sidebar-widget">
                <label>Conversation Timer</label>
                <div id="timerDisplay">00:00</div>
            </div>

            <button class="new-chat-btn" onclick="resetConversation()">New Conversation</button>
        </aside>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
