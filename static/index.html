<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tan-kung | Tangerine Workspace Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
</head>
<body>

    <header class="top-nav">
        <img class="main-logo" src="/static/tangerine-logo.png" alt="Tangerine Logo">
        <div class="header-tagline">Tangerine Support</div>
    </header>

    <div class="main-content">
        <main class="chat-column">
           <div class="chat-container">
                <div class="header">
                    <img class="avatar" src="static/bot_avater.png" alt="Tan-kung">
                    <h2>Tan-kung Support</h2>
                </div>

                <div id="chatbox">
                     <div class="message-row bot-row">
                        <img class="avatar" src="static/bot_avater.png">
                        <div class="bubble bot-bubble">
                            Hello! I am Tan-kung. Before we proceed, could you please tell me your <strong>company name</strong>?
                        </div>
                    </div>
                </div>

                <div class="input-area">
                    <input type="text" id="userInput" placeholder="Ask about Gmail, Drive..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-widget">
                <label>User Name</label>
                <input type="text" id="userNameInput" placeholder="Enter your name">
            </div>

            <div class="sidebar-widget">
                <label>Conversation Timer</label>
                <div id="timerDisplay">00:00</div>
            </div>

            <button class="new-chat-btn" onclick="resetConversation()">New Conversation</button>
            <div class="contact-box">
                <small>Need help? Email:</small><br>
                <strong>info@tangerine.co.th</strong>
            </div>
        </aside>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
