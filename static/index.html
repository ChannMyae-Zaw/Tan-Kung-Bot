<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tan-kung | Google Workspace Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="chat-container">
    <div class="header">
        <img src="static\bot_avater.png" alt="Tan-kung">
        <h2>Tan-kung Support</h2>
    </div>

    <div id="chatbox">
        <div class="message-row bot-row">
            <img class="avatar" src="static\bot_avater.png">
            <div class="bubble bot-bubble">Hello! I am Tan-kung. How can I help you with Google Workspace today?</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask about Gmail, Drive..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
